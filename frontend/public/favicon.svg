<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030c14"/>
      <stop offset="50%" stop-color="#071a14"/>
      <stop offset="100%" stop-color="#020805"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Left Pillar Gradient -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Diagonal Gradient -->
    <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Right Pillar Gradient -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle (1:1 Aspect Ratio for Google Search Console & Web Standards) -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="none" stroke="url(#borderGrad)" stroke-width="16" stroke-opacity="0.9"/>

  <!-- Stylized Geometric "N" Monogram -->
  <g transform="translate(4, 0)">
    <!-- Left Pillar -->
    <path d="M 136 130 L 188 130 L 188 382 L 136 382 Z" fill="url(#pillarGrad)" />
    
    <!-- Diagonal -->
    <path d="M 166 130 L 326 360 L 326 382 L 276 382 L 136 175 Z" fill="url(#diagGrad)" />
    
    <!-- Right Pillar -->
    <path d="M 316 130 L 368 130 L 368 382 L 316 382 Z" fill="url(#rightGrad)" />

    <!-- Accent Glow Dot -->
    <circle cx="368" cy="126" r="16" fill="#a3e635" />
  </g>
</svg>
